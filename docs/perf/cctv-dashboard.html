<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxyMaxx CCTV Multi-Camera Performance Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
    }
    .status {
      font-size: 13px;
      color: #94a3b8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .camera-card {
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .camera-header {
      padding: 8px 12px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 1px solid #334155;
    }
    .live-indicator {
      color: #ef4444;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
    .camera-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .camera-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>📹 CCTV Multi-Camera Dashboard</span>
      <span class="badge">Phase 7 Manual Gate</span>
    </h1>
    <div class="status" id="status">Connecting 12 active MJPEG camera streams...</div>
  </header>

  <div class="grid" id="cameraGrid"></div>

  <script>
    const cameraCount = 12;
    const grid = document.getElementById('cameraGrid');

    for (let i = 1; i <= cameraCount; i++) {
      const card = document.createElement('div');
      card.className = 'camera-card';
      card.innerHTML = `
        <div class="camera-header">
          <span>Camera #${i.toString().padStart(2, '0')} - Zone ${String.fromCharCode(64 + i)}</span>
          <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
        </div>
        <div class="camera-viewport">
          <img src="/stream?cam=${i}" alt="Camera ${i}" loading="eager" />
        </div>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
