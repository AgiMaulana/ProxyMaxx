<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>ProxyMaxx</title>
</head>
<body>
  <div id="view-main" class="view">
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 8.5h18"></path>
            <path d="M3 15.5h18"></path>
            <circle cx="8.5" cy="8.5" r="2.8" fill="currentColor" stroke="none"></circle>
            <circle cx="15.5" cy="15.5" r="2.8" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <h1>ProxyMaxx</h1>
        <span id="version" class="version">v1.0.6</span>
      </div>
      <span id="app-state" class="chip" role="status">Checking…</span>
    </header>

    <!--
      Visible until popup.js hides it. If this text is on screen, the script never ran or
      stopped early, which is otherwise indistinguishable from a worker that never answered.
      The version above is likewise static, so it proves which files the browser loaded even
      when no script executes.
    -->
    <p id="boot" class="boot">The popup script did not run.</p>

    <button id="capture" class="card capture" type="button" aria-pressed="false" aria-describedby="capture-detail">
      <span class="capture-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c2.6 2.6 2.6 15.4 0 18"></path>
          <path d="M12 3c-2.6 2.6-2.6 15.4 0 18"></path>
        </svg>
      </span>
      <span class="capture-text">
        <span class="capture-label">Capture this browser</span>
        <span id="capture-detail" class="capture-detail"></span>
      </span>
      <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
    </button>

    <dl class="card facts">
      <div class="fact"><dt>Proxy setting</dt><dd><span id="fact-mode">—</span></dd></div>
      <div class="fact"><dt>Controlled by</dt><dd><span id="fact-control">—</span></dd></div>
      <div class="fact">
        <dt>App</dt>
        <dd id="fact-app-value"><span id="fact-app-dot" class="dot" hidden></span><span id="fact-app">—</span></dd>
      </div>
      <div class="fact">
        <dt>HTTPS decryption</dt>
        <dd id="fact-ca-value"><span id="fact-ca-dot" class="dot" hidden></span><span id="fact-ca">—</span></dd>
      </div>
    </dl>

    <div class="card options">
      <label class="check">
        <input id="opt-localhost" type="checkbox">
        <span>Capture localhost</span>
      </label>
      <label class="port">
        <span>Port</span>
        <input id="opt-port" type="number" min="1" max="65535" inputmode="numeric">
      </label>
    </div>

    <p id="error" class="error" hidden></p>

    <!-- Re-reads the bridge, so starting the app outside this panel needs one click. -->
    <button id="retry" class="retry" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.5-5.8"></path>
        <path d="M20 4v5h-5"></path>
      </svg>
      Check again
    </button>

    <button id="checks-open" class="card checks-summary" type="button" aria-controls="checks-view">
      <span class="checks-summary-text">
        <span class="checks-title">What still stops capture</span>
        <span id="checks-count" class="checks-count"></span>
      </span>
      <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M9 5l7 7-7 7"></path>
      </svg>
    </button>
  </div>

  <div id="checks-view" class="view" hidden>
    <header class="checks-header">
      <button id="checks-back" class="back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"></path>
        </svg>
      </button>
      <h2>What still stops capture</h2>
    </header>
    <ul id="checks" class="checks"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
